name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 libxml2-utils
      - name: Check Lua syntax
        run: find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Check XML
        run: find . -name '*.xml' -not -path './.git/*' -print0 | xargs -0 xmllint --noout
